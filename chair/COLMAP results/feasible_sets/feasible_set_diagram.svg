<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 772" width="1060" height="772" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#1a365d"/>
    </marker>
    <style>
      .sub  { font-size: 0.62em; baseline-shift: -28%; font-style: italic; }
      .it   { font-style: italic; }
      .note { font-size: 11.5px; fill: #6b7280; font-style: normal; }
      .hd   { font-size: 17px; font-weight: bold; fill: #1f2933; }
      .sh   { font-size: 12px; fill: #6b7280; }
      .lbl  { font-size: 14.5px; fill: #1f2933; }
    </style>
  </defs>

  <rect width="1060" height="772" fill="#ffffff"/>

  <!-- ============ PANEL A ============ -->
  <text x="28" y="32" class="hd">A. Three back-projection pyramids and their intersection</text>
  <text x="28" y="52" class="sh">each pixel tolerance box back-projects to a 4-sided pyramid with apex at the camera centre;</text>
  <text x="28" y="68" class="sh">the opening is drawn hugely exaggerated &#8212; &#949; is about one pixel out of 800</text>

  <path d="M 564.2,313.9 L 141.7,224.6 L 159.0,192.1 Z" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 564.2,313.9 L 159.0,192.1 L 182.3,115.9 Z" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 564.2,313.9 L 182.3,115.9 L 166.5,142.4 Z" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 564.2,313.9 L 166.5,142.4 L 141.7,224.6 Z" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 141.7,224.6 L 159.0,192.1 L 182.3,115.9 L 166.5,142.4 Z" fill="none" stroke="#2b6cb0" stroke-width="1.1" stroke-opacity="0.75"/>
  <path d="M 191.4,496.0 L 248.5,169.8 L 324.9,175.0 Z" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 191.4,496.0 L 324.9,175.0 L 325.4,108.5 Z" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 191.4,496.0 L 325.4,108.5 L 243.2,104.0 Z" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 191.4,496.0 L 243.2,104.0 L 248.5,169.8 Z" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 248.5,169.8 L 324.9,175.0 L 325.4,108.5 L 243.2,104.0 Z" fill="none" stroke="#c05621" stroke-width="1.1" stroke-opacity="0.75"/>
  <path d="M 57.8,235.0 L 395.1,223.4 L 354.1,255.7 Z" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 57.8,235.0 L 354.1,255.7 L 330.6,160.9 Z" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 57.8,235.0 L 330.6,160.9 L 375.0,135.5 Z" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 57.8,235.0 L 375.0,135.5 L 395.1,223.4 Z" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a" stroke-width="0.9" stroke-opacity="0.5"/>
  <path d="M 395.1,223.4 L 354.1,255.7 L 330.6,160.9 L 375.0,135.5 Z" fill="none" stroke="#2f855a" stroke-width="1.1" stroke-opacity="0.75"/>
  <path d="M 474.9,346.6 L 459.4,291.4 L 494.1,228.4 L 515.1,278.0 Z" fill="#ffffff" fill-opacity="0.72" stroke="#4a5568" stroke-width="1.3"/>
  <path d="M 482.2,296.5 L 479.5,288.4 L 487.5,274.1 L 490.4,282.1 Z" fill="#2b6cb0" fill-opacity="0.30" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="3.5 2.5"/>
  <circle cx="484.8" cy="285.3" r="2.9" fill="#1a365d"/>
  <circle cx="564.2" cy="313.9" r="4.2" fill="#1f2933"/>
  <path d="M 155.7,418.2 L 289.6,435.1 L 286.8,375.6 L 140.2,359.1 Z" fill="#ffffff" fill-opacity="0.72" stroke="#4a5568" stroke-width="1.3"/>
  <path d="M 207.6,403.4 L 228.9,406.0 L 227.0,393.0 L 205.3,390.4 Z" fill="#c05621" fill-opacity="0.30" stroke="#c05621" stroke-width="1.6" stroke-dasharray="3.5 2.5"/>
  <circle cx="217.2" cy="398.3" r="2.9" fill="#7b341e"/>
  <circle cx="191.4" cy="496.0" r="4.2" fill="#1f2933"/>
  <path d="M 148.8,243.7 L 83.5,279.2 L 59.1,211.5 L 128.1,181.0 Z" fill="#ffffff" fill-opacity="0.72" stroke="#4a5568" stroke-width="1.3"/>
  <path d="M 114.0,233.1 L 103.8,238.2 L 98.8,223.9 L 109.2,218.9 Z" fill="#2f855a" fill-opacity="0.30" stroke="#2f855a" stroke-width="1.6" stroke-dasharray="3.5 2.5"/>
  <circle cx="106.5" cy="228.5" r="2.9" fill="#22543d"/>
  <circle cx="57.8" cy="235.0" r="4.2" fill="#1f2933"/>
  <circle cx="267.6" cy="207.0" r="6.2" fill="#1a365d"/>
  <line x1="275.6" y1="201.0" x2="299.6" y2="183.0" stroke="#1a365d" stroke-width="0.9"/>
  <text x="303.6" y="181.0" font-size="15.5" fill="#1a365d" class="it">k &#8594; X<tspan font-size="0.70em" dx="-0.88em" dy="-0.44em">&#710;</tspan><tspan dx="0.1em" dy="0.44em">&#8202;</tspan><tspan class="sub">k</tspan><tspan font-style="normal"> = (x, y, z)</tspan></text>
  <text x="580.2" y="333.9" font-size="15" fill="#1f2933" class="it">c<tspan font-size="0.70em" dx="-0.52em" dy="-0.4em">&#710;</tspan><tspan dx="-0.18em" dy="0.4em">&#8202;</tspan><tspan class="sub">1</tspan></text>
  <text x="498.8" y="277.3" font-size="13.5" fill="#1a365d" class="it">y<tspan class="sub">1k</tspan></text>
  <text x="175.4" y="502.0" font-size="15" fill="#1f2933" class="it" text-anchor="end">c<tspan font-size="0.70em" dx="-0.52em" dy="-0.4em">&#710;</tspan><tspan dx="-0.18em" dy="0.4em">&#8202;</tspan><tspan class="sub">2</tspan></text>
  <text x="223.2" y="418.3" font-size="13.5" fill="#7b341e" class="it">y<tspan class="sub">2k</tspan></text>
  <text x="57.8" y="261.0" font-size="15" fill="#1f2933" class="it" text-anchor="middle">c<tspan font-size="0.70em" dx="-0.52em" dy="-0.4em">&#710;</tspan><tspan dx="-0.18em" dy="0.4em">&#8202;</tspan><tspan class="sub">3</tspan></text>
  <text x="96.5" y="218.5" font-size="13.5" fill="#22543d" class="it" text-anchor="end">y<tspan class="sub">3k</tspan></text>
  <line x1="437.9" y1="214.5" x2="409.9" y2="244.5" stroke="#2b6cb0" stroke-width="0.9"/>
  <text x="441.9" y="210.5" font-size="15" fill="#2b6cb0" class="it">P<tspan class="sub">1k</tspan><tspan class="note"> &#8594; rectangular pyramid</tspan></text>
  <line x1="223.2" y1="406.2" x2="261.2" y2="440.2" stroke="#c05621" stroke-width="0.9"/>
  <text x="265.2" y="445.2" font-size="14" fill="#c05621" class="it">X<tspan class="sub">2k</tspan><tspan class="note"> &#8594; square pixel box</tspan></text>
  <text x="296.8" y="377.6" class="note">image plane</text>
  <circle cx="267.6" cy="207.0" r="21" fill="none" stroke="#9ca3af" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="249.6" y1="195.0" x2="193.6" y2="159.0" stroke="#1a365d" stroke-width="0.9"/>
  <text x="189.6" y="141.0" font-size="15.5" fill="#1a365d" class="it" text-anchor="end">&#8497;<tspan class="sub">k</tspan><tspan font-style="normal"> = &#8898;</tspan><tspan class="sub" font-style="normal">i</tspan><tspan>&#8194;P</tspan><tspan class="sub">ik</tspan></text>
  <text x="189.6" y="157.0" class="note" text-anchor="end">feasible set / containment volume</text>

  <rect x="38" y="516" width="546" height="120" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="54.0" y="544.0" font-size="13.5" fill="#1f2933" class="it">c<tspan font-size="0.70em" dx="-0.52em" dy="-0.4em">&#710;</tspan><tspan dx="-0.18em" dy="0.4em">&#8202;</tspan><tspan class="sub">i</tspan></text>
  <text x="54.0" y="560.0" class="note">centre of camera i, the apex of the cone</text>
  <text x="54.0" y="576.0" font-size="13.5" fill="#1f2933" class="it">&#952;<tspan font-size="0.70em" dx="-0.62em" dy="-0.48em">&#710;</tspan><tspan dx="-0.1em" dy="0.48em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal"> = [ </tspan>R<tspan font-size="0.70em" dx="-0.88em" dy="-0.44em">&#710;</tspan><tspan dx="0.1em" dy="0.44em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal"> | </tspan>t<tspan font-size="0.70em" dx="-0.46em" dy="-0.5em">&#710;</tspan><tspan dx="-0.14em" dy="0.5em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal"> ]</tspan></text>
  <text x="54.0" y="592.0" class="note">camera pose, 6 DoF</text>
  <text x="54.0" y="608.0" font-size="13.5" fill="#1f2933" class="it">y<tspan class="sub">ik</tspan><tspan font-style="normal"> = ( </tspan>u<tspan class="sub">ik</tspan><tspan font-style="normal">, </tspan>v<tspan class="sub">ik</tspan><tspan font-style="normal"> )</tspan></text>
  <text x="54.0" y="624.0" class="note">detected keypoint in view i</text>
  <text x="323.0" y="544.0" font-size="13.5" fill="#1f2933" class="it">X<tspan class="sub">ik</tspan><tspan font-style="normal"> = [ </tspan>u<tspan class="sub">ik</tspan><tspan font-style="normal"> &#177; &#949; ] &#215; [ </tspan>v<tspan class="sub">ik</tspan><tspan font-style="normal"> &#177; &#949; ]</tspan></text>
  <text x="323.0" y="560.0" class="note">square pixel tolerance box</text>
  <text x="323.0" y="576.0" font-size="13.5" fill="#1f2933" class="it">P<tspan class="sub">ik</tspan></text>
  <text x="323.0" y="592.0" class="note">back-projection pyramid of that box</text>
  <text x="323.0" y="608.0" font-size="13.5" fill="#1f2933" class="it">X<tspan class="sub">c</tspan><tspan font-style="normal"> = </tspan>R<tspan font-size="0.70em" dx="-0.88em" dy="-0.44em">&#710;</tspan><tspan dx="0.1em" dy="0.44em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal"> ( X &#8722; </tspan>c<tspan font-size="0.70em" dx="-0.52em" dy="-0.4em">&#710;</tspan><tspan dx="-0.18em" dy="0.4em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal"> )</tspan></text>
  <text x="323.0" y="624.0" class="note">camera-frame coordinates</text>

  <!-- ============ PANEL B ============ -->
  <text x="622" y="32" class="hd">B. Inside the intersection</text>
  <text x="622" y="52" class="sh">a convex polytope: thin across the rays,</text>
  <text x="622" y="68" class="sh">long along the weak direction &#8212; a zoom on the dashed circle in A</text>
  <rect x="622" y="84" width="410" height="446" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- interval hull -->
  <rect x="656" y="222" width="336" height="150" fill="none" stroke="#b7791f" stroke-width="1.7" stroke-dasharray="6 4"/>

  <!-- world axes -->
  <line x1="660" y1="192" x2="724" y2="192" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="660" y1="192" x2="660" y2="128" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="728" y="197" font-size="12.5" fill="#1f2933" class="it">X<tspan class="sub">1</tspan></text>
  <text x="644" y="122" font-size="12.5" fill="#1f2933" class="it">X<tspan class="sub">2</tspan></text>

  <!-- the polytope -->
  <path d="M 670,294 L 712,256 L 802,234 L 912,244 L 978,282 L 954,332 L 862,364 L 754,352 L 682,320 Z"
        fill="#2b6cb0" fill-opacity="0.24" stroke="#1a365d" stroke-width="1.9"/>

  <!-- weak direction -->
  <line x1="684" y1="312" x2="962" y2="288" stroke="#b7791f" stroke-width="2.3" marker-end="url(#arw)"/>
  <text x="784" y="280" font-size="15" fill="#b7791f" class="it">v<tspan class="sub">3</tspan><tspan class="note" fill="#b7791f"> weak direction</tspan></text>

  <!-- COLMAP estimate -->
  <circle cx="822" cy="302" r="4.8" fill="#1a365d"/>
  <text x="832" y="308" font-size="15" fill="#1a365d" class="it">X<tspan font-size="0.70em" dx="-0.88em" dy="-0.44em">&#710;</tspan><tspan dx="0.1em" dy="0.44em">&#8202;</tspan><tspan class="sub">k</tspan></text>
  <text x="832" y="325" class="note">COLMAP landmark</text>

  <!-- interval hull annotation -->
  <line x1="656" y1="394" x2="992" y2="394" stroke="#b7791f" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="700" y="414" font-size="13.5" fill="#b7791f" class="it">X&#772;<tspan class="sub">k1</tspan><tspan font-style="normal"> &#8722; </tspan>X&#818;<tspan class="sub">k1</tspan></text>
  <text x="790" y="414" font-size="13.5" fill="#1a365d" class="it"><tspan class="note">interval hull of &#8497;</tspan><tspan class="sub" fill="#6b7280">k</tspan></text>

  <text x="648" y="456" font-size="13.5" fill="#1f2933" class="it">s&#771;<tspan class="sub">k</tspan><tspan font-style="normal"> = max</tspan><tspan class="sub" font-style="normal">a</tspan><tspan font-style="normal"> ( </tspan>X&#772;<tspan class="sub">ka</tspan><tspan font-style="normal"> &#8722; </tspan>X&#818;<tspan class="sub">ka</tspan><tspan font-style="normal"> ) / </tspan>d<tspan class="sub">k</tspan></text>
  <text x="648" y="478" class="note">normalised spread: how far the landmark could move,</text>
  <text x="648" y="494" class="note">as a fraction of its viewing distance</text>

  <!-- ============ FOOTER ============ -->
  <line x1="28" y1="680" x2="1032" y2="680" stroke="#e5e7eb" stroke-width="1"/>
  <text x="28.0" y="710.0" font-size="14.5" fill="#1f2933" class="it">&#8497;<tspan class="sub">k</tspan><tspan font-style="normal"> = { X &#8712; &#8477;&#179; </tspan>|<tspan font-style="normal"> &#8214; &#960;( </tspan>&#952;<tspan font-size="0.70em" dx="-0.62em" dy="-0.48em">&#710;</tspan><tspan dx="-0.1em" dy="0.48em">&#8202;</tspan><tspan class="sub">i</tspan><tspan font-style="normal">, X ) &#8722; </tspan>y<tspan class="sub">ik</tspan><tspan font-style="normal"> &#8214;</tspan><tspan class="sub" font-style="normal">&#8734;</tspan><tspan font-style="normal"> &#8804; &#949;   for all </tspan>i<tspan font-style="normal"> &#8712; views(</tspan>k<tspan font-style="normal">) }</tspan></text>
  <text x="28.0" y="734.0" class="note">Cameras are held fixed at their estimates &#952;<tspan font-size="0.70em" dx="-0.62em" dy="-0.48em">&#710;</tspan><tspan dx="-0.1em" dy="0.48em">&#8202;</tspan>, so every constraint is linear in X and &#8497;<tspan class="sub" font-style="normal">k</tspan><tspan> is a convex polyhedron.</tspan></text>
</svg>
